# AXIS IDE release — on v* tags:
#   1. build the IDE + pack VSIX,
#   2. attach them to the GitHub Release,
#   3. publish to Marketplace / Open VSX when VSCE_PAT / OVSX_PAT exist.
#
# Publish order is IDE first, then pack (see PUBLISH.md).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build + release VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install IDE dependencies
        run: bun install --frozen-lockfile

      - name: Build IDE VSIX
        run: bun run package

      - name: Install pack dependencies
        working-directory: pack
        run: bun install --frozen-lockfile

      - name: Build pack VSIX
        run: bun run pack:package

      - name: Resolve versions
        id: versions
        run: |
          echo "ide=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "pack=$(node -p "require('./pack/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Attach VSIX files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            axis-ide-${{ steps.versions.outputs.ide }}.vsix
            pack/axis-${{ steps.versions.outputs.pack }}.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Idempotent publish: skip when the exact version already exists on the
      # target (re-running a tag must not fail on the unchanged pack VSIX).
      - name: Publish IDE to VS Marketplace
        if: env.VSCE_PAT != ''
        run: |
          VER="${{ steps.versions.outputs.ide }}"
          if npx --yes @vscode/vsce show hoox-sh.axis-ide --json 2>/dev/null | grep -q "\"version\": \"$VER\""; then
            echo "hoox-sh.axis-ide $VER already on the Marketplace — skipping."
          else
            npx --yes @vscode/vsce publish \
              --pat "$VSCE_PAT" \
              --packagePath "axis-ide-$VER.vsix" \
              --no-dependencies
          fi

      - name: Publish IDE to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          VER="${{ steps.versions.outputs.ide }}"
          if curl -fsSL "https://open-vsx.org/api/hoox-sh/axis-ide/$VER" >/dev/null 2>&1; then
            echo "hoox-sh.axis-ide $VER already on Open VSX — skipping."
          else
            npx --yes ovsx publish \
              "axis-ide-$VER.vsix" \
              -p "$OVSX_PAT"
          fi

      # Pack: Open VSX first so a Marketplace-side block (the reserved
      # hoox-sh.axis name) cannot prevent the Open VSX publication.
      # The Marketplace step is continue-on-error until the reserved name
      # is cleared in the publisher portal — see PUBLISH.md.
      - name: Publish pack to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          VER="${{ steps.versions.outputs.pack }}"
          if curl -fsSL "https://open-vsx.org/api/hoox-sh/axis/$VER" >/dev/null 2>&1; then
            echo "hoox-sh.axis $VER already on Open VSX — skipping."
          else
            npx --yes ovsx publish \
              "pack/axis-$VER.vsix" \
              -p "$OVSX_PAT"
          fi

      - name: Publish pack to VS Marketplace
        if: env.VSCE_PAT != ''
        continue-on-error: true
        run: |
          VER="${{ steps.versions.outputs.pack }}"
          if npx --yes @vscode/vsce show hoox-sh.axis --json 2>/dev/null | grep -q "\"version\": \"$VER\""; then
            echo "hoox-sh.axis $VER already on the Marketplace — skipping."
          else
            npx --yes @vscode/vsce publish \
              --pat "$VSCE_PAT" \
              --packagePath "pack/axis-$VER.vsix" \
              --no-dependencies
          fi
