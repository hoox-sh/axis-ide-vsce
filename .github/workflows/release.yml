# AXIS IDE release:
#   1. build the IDE + pack VSIX (v* tags and workflow_dispatch),
#   2. on a tag, attach them to the GitHub Release,
#   3. on a tag, publish to the Marketplace with Trusted Publishing (OIDC),
#      and to Open VSX when OVSX_PAT exists.
# A workflow_dispatch that is not a tag only builds. It does not publish.
#
# Publish order is IDE first, then pack (see PUBLISH.md).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build + release VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install IDE dependencies
        run: bun install --frozen-lockfile

      - name: Build IDE VSIX
        run: bun run package

      - name: Verify VSIX ships Pyodide
        run: |
          VSIX="axis-ide-$(node -p "require('./package.json').version").vsix"
          for FILE in pyodide.mjs pyodide.js pyodide-lock.json pyodide.asm.js pyodide.asm.wasm python_stdlib.zip; do
            unzip -l "$VSIX" | grep -q "extension/vendor/pyodide/0.29.5/$FILE" \
              || { echo "::error::$VSIX is missing vendor/pyodide/0.29.5/$FILE"; exit 1; }
          done
          echo "$VSIX ships the pinned Pyodide 0.29.5 runtime."

      - name: Install pack dependencies
        working-directory: pack
        run: bun install --frozen-lockfile

      - name: Build pack VSIX
        run: bun run pack:package

      - name: Resolve versions
        id: versions
        run: |
          echo "ide=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "pack=$(node -p "require('./pack/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Attach VSIX files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            axis-ide-${{ steps.versions.outputs.ide }}.vsix
            pack/axis-pack-${{ steps.versions.outputs.pack }}.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Idempotent publish: skip when the exact version already exists on the
      # target (re-running a tag must not fail on the unchanged pack VSIX).
      # Tag refs only — a manual workflow_dispatch must not publish.
      # Each `vsce publish --oidc` requests its own GitHub OIDC token. A token
      # is exchanged once and is not a PAT. Requires a Marketplace Trusted
      # Publishing policy whose workflow file is release.yml and whose
      # environment is empty. See PUBLISH.md.
      - name: Publish IDE to VS Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER="${{ steps.versions.outputs.ide }}"
          if npx --yes @vscode/vsce@4.1.1 show hoox-sh.axis-ide --json 2>/dev/null | grep -q "\"version\": \"$VER\""; then
            echo "hoox-sh.axis-ide $VER already on the Marketplace — skipping."
          else
            npx --yes @vscode/vsce@4.1.1 publish \
              --oidc \
              --packagePath "axis-ide-$VER.vsix" \
              --no-dependencies
          fi

      - name: Publish IDE to Open VSX
        if: startsWith(github.ref, 'refs/tags/') && env.OVSX_PAT != ''
        run: |
          VER="${{ steps.versions.outputs.ide }}"
          if curl -fsSL "https://open-vsx.org/api/hoox-sh/axis-ide/$VER" >/dev/null 2>&1; then
            echo "hoox-sh.axis-ide $VER already on Open VSX — skipping."
          else
            npx --yes ovsx publish \
              "axis-ide-$VER.vsix" \
              -p "$OVSX_PAT"
          fi

      # Pack after IDE so extensionPack members resolve on each gallery.
      - name: Publish pack to Open VSX
        if: startsWith(github.ref, 'refs/tags/') && env.OVSX_PAT != ''
        run: |
          VER="${{ steps.versions.outputs.pack }}"
          if curl -fsSL "https://open-vsx.org/api/hoox-sh/axis-pack/$VER" >/dev/null 2>&1; then
            echo "hoox-sh.axis-pack $VER already on Open VSX — skipping."
          else
            npx --yes ovsx publish \
              "pack/axis-pack-$VER.vsix" \
              -p "$OVSX_PAT"
          fi

      - name: Publish pack to VS Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER="${{ steps.versions.outputs.pack }}"
          if npx --yes @vscode/vsce@4.1.1 show hoox-sh.axis-pack --json 2>/dev/null | grep -q "\"version\": \"$VER\""; then
            echo "hoox-sh.axis-pack $VER already on the Marketplace — skipping."
          else
            npx --yes @vscode/vsce@4.1.1 publish \
              --oidc \
              --packagePath "pack/axis-pack-$VER.vsix" \
              --no-dependencies
          fi
